<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <meta
      name="description"
      content="Review 52 frontend-oriented design patterns and practice them with challenges that run in the browser."
    />
    <meta name="theme-color" content="#06131c" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#f6f2e9" media="(prefers-color-scheme: light)" />
    <title>Reef Patterns</title>
    <link rel="canonical" href="https://mtorre4580.github.io/reef-patterns/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Reef Patterns" />
    <meta property="og:title" content="Reef Patterns · Design patterns for frontend" />
    <meta
      property="og:description"
      content="52 patterns sorted by usage, with JavaScript examples and challenges you solve in the browser."
    />
    <meta property="og:url" content="https://mtorre4580.github.io/reef-patterns/" />
    <meta property="og:image" content="https://mtorre4580.github.io/reef-patterns/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:locale:alternate" content="es_AR" />
    <meta property="og:locale:alternate" content="pt_BR" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Reef Patterns · Design patterns for frontend" />
    <meta
      name="twitter:description"
      content="52 patterns sorted by usage, with JavaScript examples and challenges in the browser."
    />
    <meta name="twitter:image" content="https://mtorre4580.github.io/reef-patterns/og-image.png" />
    <script>
      try {
        const t = localStorage.getItem('reef-patterns:theme');
        if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
        else if (matchMedia('(prefers-color-scheme: light)').matches)
          document.documentElement.dataset.theme = 'light';
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
